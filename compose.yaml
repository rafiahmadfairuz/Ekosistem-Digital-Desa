services:
  app:
    image: desa-digital-app:local
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    working_dir: /var/www/html
    env_file:
      - .env.docker
    volumes:
      - laravel_storage:/var/www/html/storage
      - local_app_keys:/var/lib/desa-digital
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
  worker:
    image: desa-digital-app:local
    working_dir: /var/www/html
    env_file:
      - .env.docker
    command: ["php", "artisan", "queue:work", "database", "--sleep=3", "--tries=3", "--timeout=60"]
    volumes:
      - laravel_storage:/var/www/html/storage
      - local_app_keys:/var/lib/desa-digital
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
  web:
    image: desa-digital-web:local
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8000}:80"
    volumes:
      - laravel_storage:/var/www/html/storage:ro
    depends_on:
      - app
    restart: unless-stopped

  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-desa_digital}
      MYSQL_USER: ${DB_USERNAME:-desa_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.docker}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env.docker}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  laravel_storage:
  local_app_keys:
  mysql_data:
