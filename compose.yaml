services:
  app:
 
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    env_file:
      - .env.docker
    volumes:
      - .:/var/www/html
      - composer_vendor:/var/www/html/vendor
      - laravel_storage:/var/www/html/storage
      - laravel_bootstrap_cache:/var/www/html/bootstrap/cache
      - local_app_keys:/var/lib/desa-digital
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    

  web:
    image: nginx:1.28-alpine
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html:ro
      - composer_vendor:/var/www/html/vendor:ro
      - laravel_storage:/var/www/html/storage:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  vite:
    image: node:24-alpine
    working_dir: /var/www/html
    env_file:
      - .env.docker
    environment:
      VITE_DEV_SERVER_HOST: 0.0.0.0
      VITE_DEV_SERVER_ORIGIN: ${VITE_DEV_SERVER_ORIGIN:-http://localhost:5173}
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:5173:5173"
    volumes:
      - .:/var/www/html
      - npm_modules:/var/www/html/node_modules
    restart: unless-stopped

  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-desa_digital_test}
      MYSQL_USER: ${DB_USERNAME:-desa_app_test}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.docker}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env.docker}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  composer_vendor:
  npm_modules:
  laravel_storage:
  laravel_bootstrap_cache:
  local_app_keys:
  mysql_data:
